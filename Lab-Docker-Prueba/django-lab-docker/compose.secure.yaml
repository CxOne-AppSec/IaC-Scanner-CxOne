version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: secure/Dockerfile.secure

    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-change-me}"

    ports:
      - "127.0.0.1:8000:8000"

    user: "1000:1000"
    privileged: false
    cap_drop:
      - ALL
    cap_add: []

  
    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

  backup-manager:
    image: alpine
    user: nobody
    restart: unless-stopped
    cap_drop:
      - ALL

    volumes:
      - ./backups:/backups

    environment:
      BACKUP_PASSWORD: "${BACKUP_PASSWORD:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

  repository:
    build:
      context: ..
      dockerfile: secure/Dockerfile.secure

    environment:
      REPO_USER: "${REPO_USER:-}"
      REPO_PASS: "${REPO_PASS:-}"
      DB_USER: "${DB_USER:-}"
      DB_PASS: "${DB_PASS:-}"

    ports:
      - "127.0.0.1:8080:8000"

    user: "1000:1000"
    privileged: false
    cap_drop:
      - ALL
    cap_add: []

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp
